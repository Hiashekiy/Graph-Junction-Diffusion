# Graph-Junction-Diffusion V2 第一版配置（实施指南第 28 节）
#
# 说明：本文件是工程默认值，不是论文最终超参数。
# 所有键都可以在命令行用 --set key.subkey=value 覆盖。

seed: 0

data:
  graph_type: er            # er | ba | ws | geometric | grid
  num_nodes: [20, 40]       # 每个样本随机取的节点数区间
  num_samples: 256          # 总样本数（再按 split 切分）
  min_od_distance: 5        # d_G(s,g) 的下界
  num_queries_per_graph: 4  # 每张图采多少对 OD（V2 每个 OD 是一个样本）
  weighted: false           # 是否给边加随机 cost（Dijkstra 任务）
  component_fallback: true  # 生成不连通图时退回到最大连通分量
  generator: {}

split:
  train: 0.8
  val: 0.1
  test: 0.1

model:
  d_model: 128
  node_types: 4             # Ordinary / Junction / Start / Goal
  edge_states: 2            # unselected / selected
  ffn_hidden: 256
  dropout: 0.0

time:
  encoding: sinusoidal
  d_time: 128
  conditioning: adaln      # MLP(tau) -> (gamma, beta)

diffusion:
  T: 50
  schedule: linear
  beta_start: 0.02
  beta_end: 0.20
  base_noise: uniform

training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: false                # 第一版默认关掉，避免 CPU/小图上出问题
  batch_size: 8
  epochs: 50
  max_bptt_steps: 0         # 0 = 整条链反传（指南要求第一版不 detach）
  log_every: 1
  eval_every: 5
  device: auto              # auto | cpu | cuda

loss:
  x0_ce: 1.0
  null_weight: 1.0          # NULL candidate 的权重
  active_weight: 1.0        # 非 NULL candidate 的权重

evaluation:
  stochastic_sampling: true # false = 每步取 posterior argmax
  batch_size: 8
  max_steps: 0              # 0 = 用 diffusion.T

paths:
  data_dir: data
  output_dir: outputs/runs
  run_name: graph_flow
