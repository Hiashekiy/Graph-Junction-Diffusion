# Graph-Junction-Diffusion V2 第一版配置
#
# 数据部分按《V2 数据集生成指南》第 17 节配置 Controlled Junction Graph：
# 难度由 (N, L_hop, L_decision, K_avg) 描述，而不是节点数。

seed: 0

data:
  # controlled_junction 是推荐生成器；也支持 er / ba / ws / geometric / grid
  graph_type: controlled_junction
  num_samples: 3000          # 总样本数（再按 graph 划分 80/10/10）
  min_od_distance: 5         # 仅对旧的随机图生成器有效
  num_queries_per_graph: 1   # controlled 生成器每个 OD 一张图（graph_id = 样本序号）

  difficulty_mix:            # 指南第 10 节：Easy/Medium/Hard 混合训练
    easy: 0.20
    medium: 0.60
    hard: 0.20
  structure_mix:             # 指南第 12 节：统一生成器内的三种结构模式
    branch_heavy: 0.40
    long_chain: 0.40
    loop_detour: 0.20
  source:
    forced_probability: 0.70 # 70% 单出口 source（被迫段永久 selected），30% 多出口
  branch:
    ordinary_nodes_per_segment: [1, 4]   # 骨架段之间插入的 degree=2 普通节点数
    candidates_per_decision: [2, 5]      # 每个 decision 的总出口数

  weighted: false            # 只能填 false：V2 不编码 edge cost，true 会直接报错
  component_fallback: true
  generator: {}

split:
  train: 0.8
  val: 0.1
  test: 0.1
  split_by_graph: true       # 按底层图划分，禁止 topology leakage

model:
  d_model: 128
  node_types: 4              # Ordinary / Junction / Start / Goal
  edge_states: 2             # unselected / selected
  ffn_hidden: 256
  dropout: 0.0

time:
  encoding: sinusoidal       # 目前只实现 sinusoidal（其它取值会报错）
  d_time: 128
  conditioning: adaln        # 目前只实现 adaln

diffusion:
  T: 50
  schedule: linear
  beta_start: 0.02
  beta_end: 0.20
  base_noise: uniform

training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: true                  # 只在 cuda 上生效
  batch_size: 48
  epochs: 100
  max_bptt_steps: 0          # 0 = 整条链反传（指南要求第一版不 detach）
  log_every: 5
  eval_every: 5
  device: auto

loss:
  x0_ce: 1.0
  null_weight: 1.0
  active_weight: 1.0

evaluation:
  stochastic_sampling: true
  batch_size: 16
  max_steps: 0               # 只能为 0/None 或等于 diffusion.T

paths:
  data_dir: data
  output_dir: outputs/runs
  run_name: v2_controlled_100ep
